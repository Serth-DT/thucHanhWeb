<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Bán Hàng</title>
    <!-- fontawnsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Mycss-->
    <link rel="stylesheet" href="./mycss.css">
</head>

<body>
    <!-- Header -->
    <header class="bg-success text-white text-center py-3">
        <h1>Trang Web Bán Hàng</h1>
    </header>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-warning">
        <div class="container">
            <a class="nav-link" href="#">Trang Chủ</a>
            <a class="nav-link" href="#">Sản Phẩm</a>
            <a class="nav-link" href="#">Liên Hệ</a>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-4">
        <div class="row">
            <!-- Product list -->
            <div class="col-md-9">
                <div class="text-center">
                    <h1> San pham </h1>
                </div>
                <div class="row">
                    <!-- Sản phẩm -->
                    <div class="col-md-4">
                        <div class="card">
                            <img src="https://cdn-i.vtcnews.vn/files/f2/2014/07/29/ban-chai-danh-rang-va-nhung-moi-hoa-0.jpg"
                                class="card-img-top" alt="Sản phẩm">
                            <div class="card-body text-center">
                                <h5 class="card-title">Sản Phẩm</h5>
                                <p class="card-text">Mô tả sản phẩm.</p>
                                <p class="card-text">Giá: $120</p>
                                <div>
                                    <a href="#" class="btn btn-warning">Chi tiet</a>
                                    <a href="#" class="btn btn-primary">Mua Ngay</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-md-3 pt-5 mt-2 rounded" style="">
                <div class="sidebar rounded">
                    <h4>Social Media</h4>
                    <div class="social-icons">
                        <i class="fa-brands fa-facebook"><a href="#">Facebook</a></i>
                        <i class="fa-brands fa-twitter"><a href="#">Twitter</a></i>
                        <i class="fa-brands fa-instagram"><a href="#">Instagram</a></i>
                        <i class="fa-brands fa-linkedin"><a href="#">LinkedIn</a></i>
                    </div>
                </div>
            </div>
        </div>


        <!-- Footer -->
        <footer class="bg-dark text-white mt-4">
            <div class="container py-4">
                <div class="row ">
                    <div class="col-md-4 text-center">
                        <h5>Cột 1</h5>
                        <p>Nội dung cột 1.</p>
                    </div>
                    <div class="col-md-4 text-center">
                        <h5>Cột 2</h5>
                        <p>Nội dung cột 2.</p>
                    </div>
                    <div class="col-md-4 text-center">
                        <h5>Cột 3</h5>
                        <p>Nội dung cột 3.</p>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Bootstrap Script -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
